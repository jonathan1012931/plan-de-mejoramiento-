<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Inicio de sesión de SportZone"><title>SportZone | Iniciar sesión</title><link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/stilos.css"></head>
<body class="login-page"><main class="login-container"><section class="login-card" aria-labelledby="login-title">
<img class="login-logo" src="assets/img/logo.png" alt="Logo de SportZone"><header class="login-header"><h1 id="login-title">Bienvenido a SportZone</h1><p>Inicia sesión para continuar</p></header>
<form id="loginForm"><div class="form-group"><label for="email">Correo electrónico</label><input class="input" type="email" id="email" placeholder="ejemplo@correo.com" autocomplete="email" required></div><div class="form-group"><label for="password">Contraseña</label><input class="input" type="password" id="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" minlength="4" required></div><div class="login-options"><label class="remember"><input type="checkbox" id="remember"> Recordarme</label><a class="forgot-password" href="#" onclick="event.preventDefault();alert('En un sistema real se enviaría un enlace de recuperación.');">¿Olvidaste tu contraseña?</a></div><button class="login-button" type="submit">Iniciar sesión</button><div class="login-message" id="loginMessage">Acceso correcto. Redirigiendo...</div></form><div class="register-section"><p>¿No tienes una cuenta? <a href="#" onclick="event.preventDefault();alert('Registro de demostración.');">Crear cuenta</a></p></div>
</section></main>
<script>document.getElementById('loginForm').addEventListener('submit',function(e){e.preventDefault();document.getElementById('loginMessage').style.display='block';setTimeout(function(){location.href='dashboard.html'},500)});</script>
</body></html>
